<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>AES-256-CBC Text Encryptor</title>
    </head>

    <body>
        <h2>AES-256-CBC Text Encryptor</h2>

        <strong>Plaintext</strong><br>
        <textarea id="plaintext" rows="4" cols="60"></textarea><br><br>

        <strong>Password (raw, PBKDF2, 100k iterations, SHA-256)</strong><br>
        <input id="password" type="password" size="48">
        &nbsp;&nbsp;&nbsp;
        <button onclick="encryptText()">Encrypt</button><br><br>

        <strong>Salt (Base64)</strong><br>
        <textarea id="salt" rows="1" cols="60" readonly
                style="background-color: #f0f0f0;"></textarea><br><br>

        <strong>IV (Base64)</strong><br>
        <textarea id="iv" rows="1" cols="60" readonly
                style="background-color: #f0f0f0;"></textarea><br><br>

        <strong>Ciphertext (Base64)</strong><br>
        <textarea id="ciphertext" rows="4" cols="60" readonly
                style="background-color: #f0f0f0;"></textarea><br><br>

        <script>
            async function encryptText() {
                try {
                    const text = document.getElementById("plaintext").value;
                    const password = document.getElementById("password").value;
                    const encoder = new TextEncoder();

                    // Generate salt and IV
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const iv = crypto.getRandomValues(new Uint8Array(16));

                    // Derive key
                    const keyMaterial = await crypto.subtle.importKey(
                        "raw",
                        encoder.encode(password),
                        "PBKDF2",
                        false,
                        ["deriveKey"]
                    );

                    const key = await crypto.subtle.deriveKey(
                        {
                            name: "PBKDF2",
                            hash: "SHA-256",
                            salt: salt,
                            iterations: 100000
                        },
                        keyMaterial,
                        {
                            name: "AES-CBC",
                            length: 256
                        },
                        false,
                        ["encrypt"]
                    );

                    // Encrypt text
                    const ciphertextBuffer = await crypto.subtle.encrypt(
                        {
                            name: "AES-CBC",
                            iv: iv
                        },
                        key,
                        encoder.encode(text)
                    );

                    const ciphertext = new Uint8Array(ciphertextBuffer);

                    // Display outputs
                    document.getElementById("salt").textContent =
                            btoa(String.fromCharCode(...salt));
                    document.getElementById("iv").textContent =
                            btoa(String.fromCharCode(...iv));
                    document.getElementById("ciphertext").textContent =
                            btoa(String.fromCharCode(...ciphertext));
                } catch (err) {
                    document.getElementById("salt").textContent =
                            "ERROR!";
                    document.getElementById("iv").textContent =
                            "ERROR!";
                    document.getElementById("ciphertext").textContent =
                            "ERROR!";
                }
            }
        </script>
    </body>
</html>
