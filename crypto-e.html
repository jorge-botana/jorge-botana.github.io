<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AES-CBC Text Encryptor</title>
</head>
<body>
  <h2>AES-CBC Encryptor</h2>

  <label>Plaintext:</label><br/>
  <textarea id="plaintext" rows="4" cols="50"></textarea><br/><br/>

  <label>Password (used to derive key):</label><br/>
  <input type="password" id="password" /><br/><br/>

  <button onclick="encryptText()">Encrypt</button>

  <h3>Encryption Result (Base64)</h3>

  <strong>Salt:</strong>
  <pre id="saltOutput"></pre>

  <strong>IV:</strong>
  <pre id="ivOutput"></pre>

  <strong>Ciphertext:</strong>
  <pre id="ciphertextOutput"></pre>

  <script>
    function toBase64(uint8Array) {
      let binary = '';
      for (let i = 0; i < uint8Array.length; i++) {
        binary += String.fromCharCode(uint8Array[i]);
      }
      return btoa(binary);
    }

    async function encryptText() {
      const text = document.getElementById('plaintext').value;
      const password = document.getElementById('password').value;
      const encoder = new TextEncoder();

      // Generate salt and IV
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(16));

      // Derive key using PBKDF2
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-CBC", length: 256 },
        false,
        ["encrypt"]
      );

      // Encrypt text
      const ciphertextBuffer = await crypto.subtle.encrypt(
        {
          name: "AES-CBC",
          iv: iv
        },
        key,
        encoder.encode(text)
      );

      const ciphertext = new Uint8Array(ciphertextBuffer);

      // Display outputs in order: Salt, IV, Ciphertext
      document.getElementById('saltOutput').textContent = toBase64(salt);
      document.getElementById('ivOutput').textContent = toBase64(iv);
      document.getElementById('ciphertextOutput').textContent = toBase64(ciphertext);
    }
  </script>
</body>
</html>
