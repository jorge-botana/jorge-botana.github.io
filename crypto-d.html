<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>AES-256-CBC Text Decryptor</title>
    </head>
    <body>
        <h2>AES-256-CBC Text Decryptor</h2>

        <strong>Salt (Base64)</strong><br>
        <textarea id="salt" rows="1" cols="60"></textarea><br><br>

        <strong>IV (Base64)</strong><br>
        <textarea id="iv" rows="1" cols="60"></textarea><br><br>

        <strong>Ciphertext (Base64)</strong><br>
        <textarea id="ciphertext" rows="4" cols="60"></textarea><br><br>

        <strong>Password (raw, PBKDF2, 100k iterations, SHA-256)</strong><br>
        <input id="password" type="password" size="48"/>
        &nbsp;&nbsp;&nbsp;
        <button onclick="decryptText()">Decrypt</button><br><br>

        <strong>Plaintext</strong><br>
        <textarea id="plaintext" rows="4" cols="60" readonly
                style="background-color: #f0f0f0;"></textarea>

        <script>
            async function decryptText() {
                const saltBase64 =
                        document.getElementById("salt").value.trim();
                const ivBase64 =
                        document.getElementById("iv").value.trim();
                const ciphertextBase64 =
                        document.getElementById("ciphertext").value.trim();
                const password =
                        document.getElementById("password").value;

                const encoder = new TextEncoder();
                const decoder = new TextDecoder();

                try {
                    const salt = Uint8Array.from(atob(saltBase64),
                            c => c.charCodeAt(0));
                    const iv = Uint8Array.from(atob(ivBase64),
                            c => c.charCodeAt(0));
                    const ciphertext = Uint8Array.from(atob(ciphertextBase64),
                            c => c.charCodeAt(0));

                    // Derive key
                    const keyMaterial = await crypto.subtle.importKey(
                        "raw",
                        encoder.encode(password),
                        "PBKDF2",
                        false,
                        ["deriveKey"]
                    );

                    const key = await crypto.subtle.deriveKey(
                        {
                            name: "PBKDF2",
                            hash: "SHA-256",
                            salt: salt,
                            iterations: 100000
                        },
                        keyMaterial,
                        {
                            name: "AES-CBC",
                            length: 256
                        },
                        false,
                        ["decrypt"]
                    );

                    // Decrypt ciphertext
                    const plaintextBuffer = await crypto.subtle.decrypt(
                        {
                            name: "AES-CBC",
                            iv: iv
                        },
                        key,
                        ciphertext
                    );

                    const plaintext = decoder.decode(plaintextBuffer);
                    document.getElementById("plaintext").textContent =
                            plaintext;
                } catch (err) {
                    document.getElementById("plaintext").textContent =
                            "ERROR!";
                }
            }
        </script>
    </body>
</html>
