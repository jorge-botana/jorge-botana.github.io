<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AES-CBC Text Decryptor</title>
</head>
<body>
  <h2>AES-CBC Decryptor</h2>

  <label>Encrypted Input (Base64):</label><br/>
  <textarea id="ciphertext" rows="4" cols="50"></textarea><br/><br/>

  <label>Password (same used for encryption):</label><br/>
  <input type="password" id="password" /><br/><br/>

  <button onclick="decryptText()">Decrypt</button>

  <h3>Decrypted Plaintext</h3>
  <pre id="output"></pre>

  <script>
    async function decryptText() {
      const base64 = document.getElementById('ciphertext').value;
      const password = document.getElementById('password').value;
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();

      try {
        // Decode Base64 to binary
        const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

        // Extract IV and ciphertext
        const iv = binary.slice(0, 16);
        const data = binary.slice(16);

        // Derive key using same method as in encryption
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: iv,
            iterations: 100000,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-CBC", length: 256 },
          false,
          ["decrypt"]
        );

        // Decrypt
        const decrypted = await crypto.subtle.decrypt(
          {
            name: "AES-CBC",
            iv: iv
          },
          key,
          data
        );

        const plaintext = decoder.decode(decrypted);
        document.getElementById('output').textContent = plaintext;
      } catch (err) {
        document.getElementById('output').textContent = "❌ Decryption failed: " + err.message;
      }
    }
  </script>
</body>
</html>
