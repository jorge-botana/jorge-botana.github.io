    <body>

            <form onsubmit="foo(event)">
                <div class="inputBox">
                    <input type="password" id="userInput" name="userInput" placeholder=" " required>
                    <label for="userInput">Access Code</label>
                    <button type="button" id="toggleBtn" class="toggle-btn">Show</button>
                </div>
                <div id="errorMsg" class="error-message">Wrong Access Code</div>

            </form>

        <script>
            const input = document.getElementById("userInput");
            const toggleBtn = document.getElementById("toggleBtn");
            const errorMsg = document.getElementById("errorMsg");

            toggleBtn.addEventListener('mousedown', () => {
                input.type = 'text';
                toggleBtn.textContent = 'Hide';
            });

            toggleBtn.addEventListener('mouseup', () => {
                input.type = 'password';
                toggleBtn.textContent = 'Show';
            });

            toggleBtn.addEventListener('mouseleave', () => {
                // En caso de que el mouse salga del botón mientras está presionado
                input.type = 'password';
                toggleBtn.textContent = 'Show';
            });

            // Para dispositivos táctiles
            toggleBtn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // evita que se active el click también
                input.type = 'text';
                toggleBtn.textContent = 'Hide';
            });

            toggleBtn.addEventListener('touchend', () => {
                input.type = 'password';
                toggleBtn.textContent = 'Show';
            });

        <script>
            // Function to get a URL parameter by name
            function getParameterByName(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            // Autofill input field if 'pass' parameter exists
            window.onload = function() {
                const passValue = getParameterByName('pass');
                if (passValue !== null) {
                    document.getElementById('userInput').value = passValue;
                }
